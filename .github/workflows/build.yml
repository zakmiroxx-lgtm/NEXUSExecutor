name: Build NEXUS Executor

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check ZIP archive
        shell: pwsh
        run: |
          if (!(Test-Path "NEXUS.zip")) {
            throw "NEXUS.zip not found!"
          }

          Write-Host "NEXUS.zip found!"

      - name: Extract NEXUS.zip
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Path extracted `
            -Force | Out-Null

          Expand-Archive `
            -Path NEXUS.zip `
            -DestinationPath extracted `
            -Force

          Write-Host "Archive extracted successfully."

          Get-ChildItem extracted -Recurse

      - name: Find C# project
        id: project
        shell: pwsh
        run: |
          $project = Get-ChildItem extracted `
            -Recurse `
            -Filter "NEXUS.Desktop.csproj" |
            Select-Object -First 1

          if (!$project) {
            throw "NEXUS.Desktop.csproj not found!"
          }

          Write-Host "Project found:"
          Write-Host $project.FullName

          "path=$($project.FullName)" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        shell: pwsh
        run: |
          dotnet restore "${{ steps.project.outputs.path }}"

      - name: Build application
        shell: pwsh
        run: |
          dotnet build `
            "${{ steps.project.outputs.path }}" `
            --configuration Release `
            --no-restore

      - name: Publish Windows EXE
        shell: pwsh
        run: |
          dotnet publish `
            "${{ steps.project.outputs.path }}" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output publish

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem publish `
            -Filter "*.exe" |
            Select-Object -First 1

          if (!$exe) {
            throw "EXE was not generated!"
          }

          Write-Host "EXE generated:"
          Write-Host $exe.FullName

          Write-Host "Size:"
          Write-Host $exe.Length

      - name: Create release ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path publish/* `
            -DestinationPath NEXUS-Executor-Windows.zip `
            -CompressionLevel Optimal `
            -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Executor-Windows
          path: NEXUS-Executor-Windows.zip
          if-no-files-found: error
          retention-days: 30
